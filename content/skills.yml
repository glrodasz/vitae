# expertises: the three cards at the top of Skills. {years} is replaced.
# stack / frameworks: the skill groups. Groups with cv: appear on the short CV,
# listed in the order given by cvOrder.

expertises:
  - title: AI & LLM Engineering
    subtitle: Hands-on in production
    items:
      - >-
        Building RAG pipelines with PGVector, LangChain, and LangSmith for
        semantic search and agentic workflows, integrating LLM APIs from OpenAI,
        Anthropic, and Google in production systems at EQT.
  - title: Full-stack Web Engineering
    subtitle: "{years} years of experience"
    items:
      - >-
        React, TypeScript, and Next.js on the frontend; Node.js, Python, and
        GraphQL on the backend, shipping at scale across Klarna, Auth0, and EQT
        with microfrontend architectures and design systems.
  - title: Developer Enablement
    subtitle: Former Google Developer Expert
    items:
      - >-
        Trained hundreds of developers as a bootcamp instructor and online
        teacher across Latin America and Europe, and shared knowledge at
        international conferences including DevFest, Nerdearla, and EpicHey!.
stack:
  - title: AI & LLM
    description: >-
      LangChain, LangSmith, Google ADK, CopilotKit, PGVector, RAG pipelines, MCP
      servers and connectors, Gemini on Vertex AI, Ollama for local models,
      agent evals (prompt injection, grounding checks) and cost guardrails,
      prompt engineering, and LLM API integrations with OpenAI, Anthropic, and
      Google.
    cv: >-
      Google ADK, Gemini on Vertex AI, LangChain, LangSmith, MCP servers and
      connectors, RAG with PGVector, CopilotKit, agent evals, OpenAI and
      Anthropic APIs
  - title: Data
    description: >-
      PostgreSQL, BigQuery, MySQL, MongoDB, ElasticSearch, Kafka, and
      Firebase/Firestore, managing and querying datasets across millions of
      records in production.
    cv: PostgreSQL, BigQuery, MongoDB, MySQL, ElasticSearch, Kafka, Firestore
  - title: Cloud & DevOps
    description: >-
      GCP (CloudRun, CloudBuild, Cloud Workflows, BigQuery, BigTable), AWS (S3,
      EC2, SQS, DynamoDB), Cloudflare (Workers, D1, Pages), Firebase Hosting,
      Docker, Kubernetes, Datadog, CI/CD pipelines, and Linux (CentOS, Debian).
    cv: >-
      GCP (Cloud Run, Cloud Workflows, BigQuery), AWS, Cloudflare (Workers, D1,
      Pages), Firebase, Docker, Kubernetes, Datadog
  - title: Auth & Identity
    description: >-
      OAuth, OIDC, Auth0, Firebase Auth, and WebAuthn/Passkeys integrated with
      providers such as Google, Meta, Spotify, and X for secure authentication
      flows.
    cv: OAuth, OIDC, Auth0, WebAuthn and Passkeys
  - title: Backend platforms
    description: >-
      Node.js with Express, Fastify and Hapi.js, Python with FastAPI, Go and
      Rust services, GraphQL via Apollo and GraphQL Mesh, and REST APIs powering
      scalable server-side solutions.
    cv: >-
      Node.js (Express, Fastify, Hapi.js), Python (FastAPI), Go, Rust, GraphQL,
      REST
  - title: Methods & Delivery
    description: >-
      Scrum, Kanban, Scrumban, and Lean practices, paired with Design Systems,
      microfrontend architecture, and hands-on technical training for teams.
frameworks:
  - title: Frontend frameworks
    description: >-
      React (11+ years) with Hooks and state libraries like Redux and Zustand,
      Next.js for SSR and Server Components, and TypeScript across the stack.
    cv: >-
      React, Next.js, TypeScript, Redux, Zustand, Storybook, Design Tokens,
      Tailwind CSS
  - title: Testing
    description: >-
      Jest, Vitest, and Playwright for unit, integration, and end-to-end
      coverage, complemented by Storybook interaction tests and snapshot testing
      for regression prevention.
    cv: Playwright, Vitest, Jest, Storybook interaction tests
  - title: UI systems
    description: >-
      Storybook for component development, Design Tokens for consistent
      branding, and Tailwind CSS, Material Design, and Ant Design for adaptable
      UI solutions.
  - title: Build tooling
    description: >-
      Webpack and Vite production setups, plus NPM scripts and Yarn Workspaces
      for managing monorepos and dependency graphs across teams.
  - title: AI-first engineering
    description: >-
      Agent workflows with Claude Code and Cursor, reusable agent skills, and
      PR-based review.
    cv: Claude Code, Cursor, reusable agent skills, PR-based review
cvOrder:
  - AI & LLM
  - AI-first engineering
  - Backend platforms
  - Frontend frameworks
  - Cloud & DevOps
  - Data
